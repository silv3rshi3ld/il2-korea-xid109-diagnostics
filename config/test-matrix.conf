# case|VKD3D_CONFIG|VKD3D_DISABLE_EXTENSIONS|description
#
# This order is intentional: obtain an ordinary breadcrumb failure first,
# test queue topology next, descriptor buffers third, and timing-heavy sync last.
baseline|breadcrumbs||Forensic baseline: passive breadcrumbs and shader dumping
single-queue|breadcrumbs,single_queue||Disable asynchronous compute and transfer queues
no-descriptor-buffer|breadcrumbs|VK_EXT_descriptor_buffer|Disable VK_EXT_descriptor_buffer only
sync|breadcrumbs_sync||Add a full memory barrier at each breadcrumb signal
