# case|VKD3D_CONFIG|VKD3D_DISABLE_EXTENSIONS|description
#
# This order is intentional: obtain an ordinary descriptor-buffer failure first,
# run instrumented and known-stable descriptor paths next, then the remaining
# queue, descriptor-disable, and timing-heavy synchronization discriminators.
baseline|breadcrumbs||Forensic baseline: passive breadcrumbs and shader dumping
descriptor-qa|breadcrumbs,descriptor_qa_checks||Instrument descriptor accesses and log descriptor QA faults
descriptor-heap|breadcrumbs,descriptor_heap||Use the known-stable VK_EXT_descriptor_heap path
single-queue|breadcrumbs,single_queue||Disable asynchronous compute and transfer queues
no-descriptor-buffer|breadcrumbs|VK_EXT_descriptor_buffer|Disable VK_EXT_descriptor_buffer only
sync|breadcrumbs_sync||Add a full memory barrier at each breadcrumb signal
